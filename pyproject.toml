[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hostel-mess-menu-optimizer"
version = "0.3.0"
description = "NSGA-II weekly menu optimization for a hostel mess"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pymoo>=0.6.1",
    "streamlit>=1.50",
    "plotly>=5.24",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
